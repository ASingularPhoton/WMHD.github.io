<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | WMHD Radio</title>

<link rel="icon" href="./images/favicon-32x32.png" type="image/png">

<style>

/* ================= RESET ================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* ================= HERO ================= */

.hero {
  position: relative;
  width: 100%;
  height: 70vh;
  background-image: url("./images/background.jpg");
  background-size: cover;
  background-position: center;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.hero-content {
  position: relative;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  animation: fadeIn 0.8s ease-in-out;
}

.textwrap h1 {
  font-size: 3rem;
}

.textwrap h2 {
  font-weight: 300;
  margin-bottom: 10px;
}

.heavy { font-weight: 900; }
.light { font-weight: 300; }

/* ================= NAVBAR ================= */

.navbar {
  width: 100%;
  background: rgba(0,0,0,0.9);
  padding: 12px 0;
}

.nav-container {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  list-style: none;
}

.nav-left,
.nav-right {
  display: flex;
  gap: 20px;
}

.nav-container a {
  color: white;
  text-decoration: none;
  padding: 10px 14px;
  font-size: 15px;
}

.nav-container a:hover {
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
}

.nav-brand img {
  width: 90px;
}

/* ================= DISCORD FLOAT ================= */

.discord-overlay {
  position: fixed;
  top: 25px;
  right: 25px;
  z-index: 999;
}

.discord-overlay img {
  width: 60px;
  height: 60px;
}

/* ================= ANIMATION ================= */

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  /* Stack navbar */
  .nav-container {
    flex-direction: column;
    gap: 12px;
  }

  .nav-left,
  .nav-right {
    flex-wrap: wrap;
    justify-content: center;
  }

  .nav-container a {
    font-size: 14px;
    padding: 8px 12px;
  }

  /* Logo fades away after 5 seconds */
  .nav-brand {
    animation: fadeOut 1s ease forwards;
    animation-delay: 5s;
  }

  .nav-brand img {
    width: 70px;
  }

  /* Discord moves bottom-right */
  .discord-overlay {
    top: auto;
    bottom: 15px;
    right: 15px;
  }

  .discord-overlay img {
    width: 48px;
    height: 48px;
  }

  /* Hero text smaller */
  .textwrap h1 {
    font-size: 2.2rem;
  }

  .textwrap h2 {
    font-size: 1rem;
  }
}

/* Hide Discord on very small phones */
@media (max-width: 480px) {
  .discord-overlay {
    display: none;
  }
}

</style>
</head>

<body>

<!-- Discord Button -->
<div class="discord-overlay">
  <a href="https://discord.gg/qm2C9yDzVq" target="_blank">
    <img src="./images/discordlogo.jpg" alt="Join our Discord">
  </a>
</div>

<!-- HERO -->
<section class="hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <div class="textwrap">
      <h2>Where Music Has Dimension</h2>
      <h1>
        <span class="heavy">WMHD RADIO</span>
        <span class="light">The Monkey</span>
      </h1>
      <h2>Rose-Hulman Institute of Technology</h2>
    </div>
  </div>
</section>

<!-- NAVBAR -->
<nav class="navbar">
  <ul class="nav-container">

    <li class="nav-left">
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
    </li>

    <li class="nav-brand">
      <a href="index.html">
        <img src="./images/logo.png" alt="WMHD Logo">
      </a>
    </li>

    <li class="nav-right">
      <a href="https://commerce.cashnet.com/rosehulmanem?CNAME=STUDENT%20ACTV">Store</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeggZD4Busmn-YDP0NbEWqNMB_leOIePlblqkMUsb9WULST9g/viewform">
        Rental/DJ Requests
      </a>
    </li>

  </ul>
</nav>

</body>
</html>
