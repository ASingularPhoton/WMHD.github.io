<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | WMHD Radio</title>

<link rel="icon" href="./images/favicon-32x32.png" type="image/png">

<style>

/* ================= RESET ================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* Page fade-in */
body {
  animation: pageFade 0.8s ease;
}

@keyframes pageFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ================= HERO ================= */

.hero {
  height: 100vh;
  width: 100%;
  background-image: url("./images/background.jpg");
  background-size: cover;
  background-position: right bottom;   /* lock to bottom-right */
  background-repeat: no-repeat;
  position: relative;
}


/* single subtle overlay */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
}

.hero-content {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-bottom: 120px;
  z-index: 2;
}

.textwrap {
  max-width: 800px;
}

.textwrap h1 {
  font-size: 3.2rem;
}

.textwrap h2 {
  font-size: 1.2rem;
  font-weight: 300;
  margin-bottom: 10px;
}

.heavy { font-weight: 900; }
.light { font-weight: 300; }

/* ================= NAVBAR ================= */

.navbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(0,0,0,0.95);
  padding: 12px 0;
  z-index: 1000;
}

.nav-container {
  max-width: 1100px;
  margin: auto;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-left,
.nav-right {
  display: flex;
  gap: 20px;
}

.nav-container a {
  color: white;
  text-decoration: none;
  padding: 10px 14px;
  font-size: 15px;
}

/* Hover only for text links */
.nav-left a:hover,
.nav-right a:hover {
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
}

/* Remove highlight from logo */
.nav-brand a {
  padding: 0;
}

.nav-brand a:hover {
  background: none;
}

.nav-brand img {
  width: 90px;
  display: block;
}

/* ================= DISCORD BUTTON ================= */

.discord-overlay {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 5000;
}

.discord-overlay img {
  width: 60px;
  height: 60px;
}

/* ================= ANIMATIONS ================= */

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  /* Prevent hero background from scrolling */
  .hero {
    background-attachment: scroll; /* ensures the image stays in place relative to viewport */
    background-position: right center;
  }

  /* Slightly shift the logo to the right */
  .nav-brand {
    order: -1;
    width: 100%;
    display: flex;
    justify-content: flex-start; /* shift right slightly */
    padding-left: 20px; /* adjust this value for the exact shift */
  }

  .nav-brand img {
    width: 70px;
  }

  /* Discord fades away on mobile */
  .discord-overlay {
    animation: fadeOut 1s ease forwards;
    animation-delay: 5s;
  }

  .discord-overlay img {
    width: 48px;
    height: 48px;
  }
}


</style>
</head>

<body>

<!-- Discord -->
<div class="discord-overlay">
  <a href="https://discord.gg/qm2C9yDzVq" target="_blank">
    <img src="./images/discordlogo.jpg" alt="Join our Discord">
  </a>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <div class="textwrap">
      <h2>Where Music Has Dimension</h2>
      <h1>
        <span class="heavy">WMHD RADIO</span>
        <span class="light">The Monkey</span>
      </h1>
      <h2>Rose-Hulman Institute of Technology</h2>
    </div>
  </div>
</section>

<!-- NAVBAR -->
<nav class="navbar">
  <ul class="nav-container">

    <li class="nav-left">
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
    </li>

    <li class="nav-brand">
      <a href="index.html">
        <img src="./images/logo.png" alt="WMHD Logo">
      </a>
    </li>

    <li class="nav-right">
      <a href="https://commerce.cashnet.com/rosehulmanem?CNAME=STUDENT%20ACTV">Store</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeggZD4Busmn-YDP0NbEWqNMB_leOIePlblqkMUsb9WULST9g/viewform">
        Rental/DJ Requests
      </a>
    </li>

  </ul>
</nav>

</body>
</html>
